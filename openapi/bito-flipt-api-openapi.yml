components:
  schemas:
    OrderRolloutsRequest:
      required:
      - rolloutIds
      type: object
      properties:
        flagKey:
          type: string
        namespaceKey:
          type: string
        rolloutIds:
          type: array
          items:
            type: string
    CreateNamespaceRequest:
      required:
      - key
      - name
      type: object
      properties:
        key:
          type: string
        name:
          type: string
        description:
          type: string
    Variant:
      type: object
      properties:
        id:
          type: string
        flagKey:
          type: string
        key:
          type: string
        name:
          type: string
        description:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        attachment:
          type: string
        namespaceKey:
          type: string
    FlagList:
      type: object
      properties:
        flags:
          type: array
          items:
            $ref: '#/components/schemas/Flag'
        nextPageToken:
          type: string
        totalCount:
          type: integer
          format: int32
    UpdateConstraintRequest:
      required:
      - type
      - property
      - operator
      type: object
      properties:
        id:
          type: string
        segmentKey:
          type: string
        type:
          enum:
          - UNKNOWN_COMPARISON_TYPE
          - STRING_COMPARISON_TYPE
          - NUMBER_COMPARISON_TYPE
          - BOOLEAN_COMPARISON_TYPE
          - DATETIME_COMPARISON_TYPE
          - ENTITY_ID_COMPARISON_TYPE
          type: string
          format: enum
        property:
          type: string
        operator:
          type: string
        value:
          type: string
        namespaceKey:
          type: string
        description:
          type: string
    CreateRuleRequest:
      required:
      - rank
      type: object
      properties:
        flagKey:
          type: string
        segmentKey:
          type: string
